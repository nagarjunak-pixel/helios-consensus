[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-consensus"
version = "1.1.0"
description = "Library-style Raft consensus engine in Python with segmented binary WAL, asyncio TCP transport, Multi-Raft sharding, Jepsen-style fault-injection simulator, Wing-Gong-Lowe linearizability checker, and C++20 kernels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" }
]
keywords = [
  "raft",
  "consensus",
  "distributed-systems",
  "linearizability",
  "jepsen",
  "deterministic-simulation",
  "wal",
  "multiraft",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
]

[project.urls]
Homepage = "https://github.com/nagarjunak-pixel/helios-consensus"
Repository = "https://github.com/nagarjunak-pixel/helios-consensus"
Issues = "https://github.com/nagarjunak-pixel/helios-consensus/issues"
Changelog = "https://github.com/nagarjunak-pixel/helios-consensus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.115.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]

[project.scripts]
helios = "helios_consensus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_consensus"]

[tool.hatch.build.targets.sdist]
include = [
  "src/helios_consensus/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N812", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
